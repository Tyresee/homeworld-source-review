<body data-home-share>
  <main class="share-shell">
    <header class="share-heading">
      <h1 id="share-title">My Home</h1>
      <span id="share-kind" class="share-example" hidden>fictional sample</span>
    </header>
    <section class="share-model" aria-label="3D home showcase">
      <div id="share-stage" tabindex="0" aria-label="3D home viewing area; drag to rotate and zoom"></div>
      <div id="share-loading" class="share-overlay" role="status" aria-live="polite">
        <div class="share-loading-art" aria-hidden="true"><span>⌂</span><i></i><i></i><i></i></div>
        <h2 id="share-loading-label">Loading…</h2>
      </div>
      <div id="share-error" class="share-overlay share-error" role="alert" hidden>
        <h2 id="share-error-title">This home could not be opened</h2>
        <p id="share-error-detail"></p>
        <button id="share-retry" type="button">Retry</button>
      </div>
    </section>
    <footer class="share-footnote"><time id="share-published" hidden></time></footer>
  </main>
  <script type="module" src="./js/home-share-page.js"></script>
