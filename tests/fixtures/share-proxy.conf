# Syntax-policy test fixture only. Not a deployment configuration.
location ^~ /games/homeworld/ {
    proxy_pass http://127.0.0.1:1;
    # A location's add_header replaces inherited server headers. Retain the
    # platform security baseline while giving public achievement URLs their
    # own no-referrer policy instead of appending a weaker inherited policy.
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8k;
}
